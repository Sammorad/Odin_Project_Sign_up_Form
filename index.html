<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="logo">
    <div class="odin">
        <img src="https://cdn.statically.io/gh/TheOdinProject/curriculum/5f37d43908ef92499e95a9b90fc3cc291a95014c/html_css/project-sign-up-form/odin-lined.png" alt="">
        <p>odin</p>
    </div>

   </div> 
   <form action="">
    <div class="top">
        <p class="top_1"><strong>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started.</strong></p>
        <p class="top-2"><strong>You know you want to.</strong></p>
    </div>
    <div class="middle">
        <p><strong>Let's do this!'</strong></p>
        <div class="name">
            <div class="nm1">
            <label for="name1">FIRST NAME</label>
            <input type="text" id="name1" name="First-NAme" >
        </div>
        <div class="nm2">
            <label for="name2">LAST NAME</label>
            <input type="text" id="name2" name="Surname">
        </div>
        </div>
        <div class="telemail">
            <div class="email">
                <label for="email">EMAIL</label>
                <input type="email" name="email" id="email">
            </div>
            <div class="phone">
                <label for="phone">PHONE NUMBER</label>
                <input type="text" name="phone" id="phone">

            </div>
            
        </div>
        <div class="pass">
            <div class="password">
                <label for="password">PASSWORD</label>
                <input type="password" id="password" required minlength="8">
            </div>
            <div class="confirmed"> 
                <label for="conf">CONFIRM PASSWORD</label>
                <input type="password" id="conf" required minlength="8">
            </div>
        </div>
        
    </div>
    <div class="bottom">
        <div class="but">
            <button>Create Account</button>
        </div>
        <p>Already have an account? <a href="">Log in</a></p>
    </div>
   </form>
</body>
</html>
